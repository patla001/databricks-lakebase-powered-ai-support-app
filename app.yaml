command:
  - "python"
  - "app.py"

env:
  # --- Credentials, injected by the Databricks platform ---------------------
  # `valueFrom` names an *app resource*, not a secret scope. Add the resource
  # first (app page > Edit > App resources > + Add resource > Secret), giving it
  # the resource key used below:
  #
  #   resource key      scope      key            permission
  #   lakebase-url      support    lakebase-url   Can read
  #
  # Databricks resolves that to the DECRYPTED secret value and sets it as this
  # env var, so no credential is ever in this file or in git. Adding the
  # resource also grants the app's service principal read on that secret -
  # which is why no `databricks secrets put-acl` step is needed.
  - name: LAKEBASE_URL
    valueFrom: lakebase-url

  # --- Fallback: read the secret through the SDK ----------------------------
  # Only used if the resource above is missing, in which case lakebase.py
  # fetches from this scope itself. That path needs the service principal to
  # hold READ on the scope. The app logs which source it actually used
  # ("Lakebase URL resolved from ...") at the first database call.
  - name: LAKEBASE_SECRET_SCOPE
    value: "support"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"

  # --- Non-secret configuration --------------------------------------------
  # Never run Flask's debug server / interactive reloader in the deployed app.
  - name: FLASK_DEBUG
    value: "0"
